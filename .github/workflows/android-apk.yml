name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - "project.godot"
      - "export_presets.cfg"
      - "scenes/**"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/android-apk.yml"

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Validate Android SDK
        shell: bash
        run: |
          set -euo pipefail
          test -n "${ANDROID_HOME:-}"
          test -x "$ANDROID_HOME/platform-tools/adb"
          test -d "$ANDROID_HOME/build-tools/35.0.1"
          test -d "$ANDROID_HOME/platforms/android-35"

      - name: Download Godot 4.7.2
        shell: bash
        run: |
          set -euo pipefail
          GODOT_VERSION="4.7.2"
          ARCHIVE="Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          URL="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/${ARCHIVE}"
          SHA256="cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4"
          curl --fail --location --retry 3 --output "$ARCHIVE" "$URL"
          printf '%s  %s\n' "$SHA256" "$ARCHIVE" | sha256sum --check --status
          unzip -q "$ARCHIVE" -d .godot-ci
          chmod +x ".godot-ci/Godot_v${GODOT_VERSION}-stable_linux.x86_64"

      - name: Install Godot Android export templates
        shell: bash
        run: |
          set -euo pipefail
          GODOT_VERSION="4.7.2"
          ARCHIVE="Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          URL="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/${ARCHIVE}"
          curl --fail --location --retry 3 --output "$ARCHIVE" "$URL"
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          unzip -q "$ARCHIVE" -d .godot-templates
          cp -a .godot-templates/templates/. "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/"

      - name: Export one debug APK
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build
          mkdir -p build
          GODOT_BIN=".godot-ci/Godot_v4.7.2-stable_linux.x86_64"
          timeout 180s "$GODOT_BIN" --headless --path . --export-debug "Android Debug" build/PoliceSimulator3D-debug.apk
          test -s build/PoliceSimulator3D-debug.apk

      - name: Inspect APK
        shell: bash
        run: |
          set -euo pipefail
          test -s build/PoliceSimulator3D-debug.apk
          file build/PoliceSimulator3D-debug.apk
          unzip -tq build/PoliceSimulator3D-debug.apk
          "$ANDROID_HOME/build-tools/35.0.1/apksigner" verify --verbose build/PoliceSimulator3D-debug.apk
          sha256sum build/PoliceSimulator3D-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: PoliceSimulator3D-debug-apk
          path: build/PoliceSimulator3D-debug.apk
          if-no-files-found: error
          retention-days: 14
